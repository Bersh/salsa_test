[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foasalsa"
version = "0.1.0"
description = "First-order ambisonics encoding and SALSA (Spatial Cue-Augmented Log-Spectrogram) features in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["foasalsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
